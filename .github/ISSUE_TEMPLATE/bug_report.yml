name: Bug report
description: A plugin or the catalog doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For problems with the Fleet app itself, use https://fleetify.dev/contact.
        Security issues belong in a private report (see SECURITY.md), not here.
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: The plugin's folder name in this repo.
      placeholder: github
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown on the plugin's page in Fleet, or in its `.fleetify-plugin/plugin.json`.
      placeholder: 0.1.2
  - type: input
    id: fleet-version
    attributes:
      label: Fleet version
      placeholder: 1.0.0
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The coding agent you used the plugin with.
      placeholder: claude-code
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens and personal data first.
      render: text
